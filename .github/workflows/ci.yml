name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

# Every action is pinned to a full commit SHA (the version is in the comment). Dependabot keeps the pins current.
# Linux is the supported platform, so everything runs on Ubuntu.
jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Check lint and docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Check that the vendored libusb feature builds
        run: cargo check --workspace --locked --features vendored

      - name: Check docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Run doc tests
        run: cargo test --doc --locked

  msrv:
    name: MSRV (${{ matrix.crate }} ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: hantek6xx4-lib
            toolchain: "1.74"
          - crate: hantek6xx4-cli
            toolchain: "1.85"
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the minimum supported Rust version
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal

      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Check
        run: cargo +${{ matrix.toolchain }} check -p ${{ matrix.crate }} --locked

  package:
    name: Check packaging
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Package the library
        run: cargo package -p hantek6xx4-lib --locked
