name: Release-plz

# Computes the next version from conventional commits. On every push to main it:
#  - publishes to crates.io, pushes the tag and creates the GitHub release for any version that is not released
#    yet (that is the case right after a release PR is merged);
#  - opens or updates a release PR with the version bump and changelog, if the new commits warrant a release.
# The crates.io token is the CARGO_REGISTRY_TOKEN secret of the `release` environment.
# Every action is pinned to a full commit SHA (the version is in the comment).

on:
  push:
    branches:
      - main

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: ${{ github.repository_owner == 'DKrepsky' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Run release-plz release
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-pr:
    name: Release PR
    if: ${{ github.repository_owner == 'DKrepsky' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Update Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev pkg-config

      - name: Run release-plz release-pr
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
