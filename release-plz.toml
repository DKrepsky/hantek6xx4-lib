[workspace]
# Both crates share one version (`version.workspace`), so there is one tag, one GitHub release and one changelog for
# the whole workspace. They come from the library package below; the CLI package only publishes.
git_release_enable = false
git_tag_enable = false
changelog_path = "./CHANGELOG.md"
# Only these commits trigger a release: feat, fix, and breaking changes (`!` after the type/scope, or a
# `BREAKING CHANGE:` footer). Other types (docs, ci, chore, test, ...) never open a release PR on their own.
release_commits = '(?m)^((feat|fix)(\([^)]*\))?!?:|[a-z]+(\([^)]*\))?!:|BREAKING[ -]CHANGE:)'

[[package]]
name = "hantek6xx4-lib"
git_release_enable = true
git_tag_enable = true
# Tags look like `v0.1.2`.
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
# The CLI commits belong in the same changelog.
changelog_include = ["hantek6xx4-cli"]

[[package]]
name = "hantek6xx4-cli"
changelog_update = false
